<!DOCTYPE html>
<html>
<head>
    <title>Person List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { color: #0066cc; text-decoration: none; margin-right: 10px; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 8px 12px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #45a049; }

        /* Theme toggle */
        .theme-toggle {
            float: right;
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .theme-toggle:hover { background-color: #f0f0f0; }
        .theme-icon { margin-right: 8px; }

        /* Dark theme */
        .dark-theme { background: #1e2a35; color: #e0e6ed; }
        .dark-theme h1 { color: #e0e6ed; }
        .dark-theme table { border-color: #3a4a5a; }
        .dark-theme th { background-color: #263240; color: #e0e6ed; border-color: #3a4a5a; }
        .dark-theme td { border-color: #3a4a5a; color: #b0bec5; }
        .dark-theme a { color: #4fc3f7; }
        .dark-theme p { color: #b0bec5; }
        .dark-theme .theme-toggle {
            background-color: #2d3a47;
            color: #e0e6ed;
            border-color: #4a5a6a;
        }
        .dark-theme .theme-toggle:hover { background-color: #3a4a5a; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Persons</h1>
        <button class="theme-toggle" onclick="toggleTheme()">
            <span class="theme-icon">🌙</span> Toggle Theme
        </button>
    </div>
    <a href="{% url 'person_create' %}" class="btn">Add New Person</a>
    
    {% if persons %}
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Phone Number</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Ethnicity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for person in persons %}
                    <tr>
                        <td>{{ person.user.username }}</td>
                        <td>{{ person.phone_number }}</td>
                        <td>{{ person.city }}</td>
                        <td>{{ person.state }}</td>
                        <td>{{ person.ethnicity }}</td>
                        <td>
                            <a href="{% url 'person_detail' person.pk %}">View</a>
                            <a href="{% url 'person_update' person.pk %}">Edit</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No persons found.</p>
    {% endif %}

    <script>
        (function() {
            if (localStorage.getItem('sa_theme') === 'dark') {
                document.body.classList.add('dark-theme');
            }
        })();
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('sa_theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        }
    </script>
</body>
</html>
