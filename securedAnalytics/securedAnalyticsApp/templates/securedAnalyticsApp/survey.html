<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment - SECUREDAnalytics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f5f7fa;
            color: #243447;
        }
        .container {
            width: 92%;
            max-width: 860px;
            margin: 32px auto;
            background: #ffffff;
            border: 1px solid #dce3ea;
            border-radius: 8px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            padding: 32px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
        }
        h1 {
            margin: 0;
            color: #1a2634;
            font-size: 24px;
        }
        .page-info {
            color: #607d8b;
            font-size: 14px;
        }

        /* --- Question card --- */
        .question-card {
            background: #f9fbfd;
            border: 1px solid #e2e9f0;
            border-radius: 6px;
            padding: 20px 24px 16px 24px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 14px 0;
            color: #1a2634;
        }
        .question-number {
            font-weight: bold;
            color: #0d3a60;
        }

        /* --- Likert scale (horizontal radio row) --- */
        .likert-row {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }
        .likert-option {
            flex: 1;
            text-align: center;
        }
        .likert-option input[type="radio"] {
            display: block;
            margin: 0 auto 4px auto;
            cursor: pointer;
        }
        .likert-option label {
            display: block;
            font-size: 13px;
            color: #455a64;
            cursor: pointer;
            line-height: 1.3;
        }

        /* --- Navigation --- */
        .nav-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 28px;
        }
        .btn {
            border: none;
            background: #26a69a;
            color: #ffffff;
            padding: 12px 36px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background: #2bbbad;
        }
        .btn:disabled, .btn.disabled {
            background: #b0bec5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Assessment</h1>
            <span class="page-info">Page {{ page_number }} of {{ total_pages }}</span>
        </div>

        <form method="post" action="{% url 'survey' %}" id="surveyForm">
            {% csrf_token %}

            {% for q in questions %}
            <div class="question-card">
                <p class="question-text">
                    <span class="question-number">{{ forloop.counter|add:start_number }}.</span> {{ q.text }}
                </p>
                <div class="likert-row">
                    {% with qname="q_"|add:q.pk|stringformat:"s" %}
                    <div class="likert-option">
                        <input type="radio" id="q{{ q.pk }}_ha" name="q_{{ q.pk }}" value="5" required>
                        <label for="q{{ q.pk }}_ha">Highly Agree</label>
                    </div>
                    <div class="likert-option">
                        <input type="radio" id="q{{ q.pk }}_a" name="q_{{ q.pk }}" value="4">
                        <label for="q{{ q.pk }}_a">Agree</label>
                    </div>
                    <div class="likert-option">
                        <input type="radio" id="q{{ q.pk }}_n" name="q_{{ q.pk }}" value="3">
                        <label for="q{{ q.pk }}_n">Neutral</label>
                    </div>
                    <div class="likert-option">
                        <input type="radio" id="q{{ q.pk }}_d" name="q_{{ q.pk }}" value="2">
                        <label for="q{{ q.pk }}_d">Disagree</label>
                    </div>
                    <div class="likert-option">
                        <input type="radio" id="q{{ q.pk }}_hd" name="q_{{ q.pk }}" value="1">
                        <label for="q{{ q.pk }}_hd">Highly Disagree</label>
                    </div>
                    {% endwith %}
                </div>
            </div>
            {% endfor %}

            <div class="nav-row">
                {% if is_last %}
                <button type="submit" class="btn" id="submitBtn">Done</button>
                {% else %}
                <button type="submit" class="btn" id="submitBtn">Next</button>
                {% endif %}
            </div>
        </form>
    </div>

    <script>
        // Enable the button only when all questions on the page are answered
        (function () {
            var form = document.getElementById("surveyForm");
            var btn = document.getElementById("submitBtn");
            var totalQuestions = {{ questions|length }};

            function countAnswered() {
                var names = {};
                form.querySelectorAll("input[type=radio]:checked").forEach(function (r) {
                    names[r.name] = true;
                });
                return Object.keys(names).length;
            }

            function update() {
                btn.disabled = countAnswered() < totalQuestions;
            }

            btn.disabled = true;
            form.addEventListener("change", update);
        })();
    </script>
</body>
</html>
