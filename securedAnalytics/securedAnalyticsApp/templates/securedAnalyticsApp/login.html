<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SECUREDAnalytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-bg: #1a2634;
            --sidebar-text: #ffffff;
            --main-bg: #f5f5f5;
            --footer-bg: #37474f;
            --footer-text: #b0bec5;
            --primary-btn: #26a69a;
            --primary-btn-hover: #2bbbad;
            --link-color: #26a69a;
        }

        .dark-theme {
            --main-bg: #1e2a35;
            --sidebar-bg: #1a2634;
            --footer-bg: #1a2634;
            --footer-text: #8899a6;
        }

        .dark-theme .theme-toggle {
            background-color: #2d3a47;
            color: #e0e6ed;
            border-color: #4a5a6a;
        }
        .dark-theme .theme-toggle:hover { background-color: #3a4a5a; }
        .dark-theme .login-title { color: #e0e6ed; }
        .dark-theme .form-group label { color: #c8d6e0; }
        .dark-theme .form-group input {
            background-color: #2d3a47;
            color: #e0e6ed;
            border-color: #4a5a6a;
        }
        .dark-theme .forgot-password { color: #b0bec5; }
        .dark-theme .error-message {
            background-color: #3b2020 !important;
            color: #f5a5a5 !important;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--main-bg);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px;
            background-color: var(--main-bg);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-toggle:hover {
            background-color: #f0f0f0;
        }

        .theme-icon {
            margin-right: 8px;
        }

        .content-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* Login Form */
        .login-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .login-title .lock-icon {
            margin-right: 10px;
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .form-group label {
            width: 80px;
            text-align: right;
            margin-right: 10px;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-btn);
        }

        .login-btn {
            width: 280px;
            padding: 12px;
            background-color: var(--primary-btn);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--primary-btn-hover);
        }

        .forgot-password {
            margin-top: 20px;
            font-size: 14px;
            color: #333;
        }

        .forgot-password a {
            color: var(--link-color);
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <button class="theme-toggle" onclick="toggleTheme()">
                <span class="theme-icon">🌙</span> Toggle Theme
            </button>
        </header>

        <div class="content-area">
            <div class="login-container">
                <h1 class="login-title">
                    <span class="lock-icon">🔐</span> Secured Analytics Login
                </h1>
                {% if error %}
                <div class="error-message" style="color: #e74c3c; background-color: #fdeaea; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
                    {{ error }}
                </div>
                {% endif %}
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn">Log In</button>
                </form>
                <p class="forgot-password">
                    Forgot your password? <a href="#">Contact admin</a>.
                </p>
            </div>
        </div>

        <footer class="footer">
            © SECUREDAnalytics | Powered by LION Institute
        </footer>
    </main>

    <script>
        (function() {
            if (localStorage.getItem('sa_theme') === 'dark') {
                document.body.classList.add('dark-theme');
            }
        })();
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('sa_theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        }
    </script>
</body>
</html>
