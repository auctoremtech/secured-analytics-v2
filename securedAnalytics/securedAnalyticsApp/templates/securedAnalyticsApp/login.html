<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SECUREDAnalytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-bg: #1a2634;
            --sidebar-text: #ffffff;
            --main-bg: #f5f5f5;
            --footer-bg: #37474f;
            --footer-text: #b0bec5;
            --primary-btn: #26a69a;
            --primary-btn-hover: #2bbbad;
            --link-color: #26a69a;
        }

        .dark-theme {
            --main-bg: #263238;
            --sidebar-bg: #1a2634;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--main-bg);
        }

        /* Sidebar Styles */
        .sidebar {
            width: 220px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .user-profile {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-avatar {
            font-size: 12px;
            color: #b0bec5;
            margin-bottom: 5px;
        }

        .user-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-role {
            font-size: 14px;
            color: #b0bec5;
        }

        .nav-menu {
            list-style: none;
            padding: 10px 0;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-item.disabled {
            color: #607d8b;
            pointer-events: none;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px;
            background-color: var(--main-bg);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-toggle:hover {
            background-color: #f0f0f0;
        }

        .theme-icon {
            margin-right: 8px;
        }

        .content-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* Login Form */
        .login-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .login-title .lock-icon {
            margin-right: 10px;
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .form-group label {
            width: 80px;
            text-align: right;
            margin-right: 10px;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-btn);
        }

        .login-btn {
            width: 280px;
            padding: 12px;
            background-color: var(--primary-btn);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--primary-btn-hover);
        }

        .forgot-password {
            margin-top: 20px;
            font-size: 14px;
            color: #333;
        }

        .forgot-password a {
            color: var(--link-color);
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="user-profile">
            <div class="user-avatar">User Avatar</div>
            <div class="user-name">User</div>
            <div class="user-role">Role</div>
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="#" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a></li>
                <li><a href="#" class="nav-item"><span class="nav-icon">☑️</span> Check-ins</a></li>
                <li><a href="#" class="nav-item"><span class="nav-icon">🎯</span> Goals</a></li>
                <li><a href="#" class="nav-item"><span class="nav-icon">💬</span> Support</a></li>
                <li><a href="#" class="nav-item disabled"><span class="nav-icon">📋</span> Assessment</a></li>
                <li><a href="#" class="nav-item"><span class="nav-icon">📈</span> Analytics</a></li>
                <li><a href="#" class="nav-item"><span class="nav-icon">▶️</span> Onboarding</a></li>
                <li><a href="#" class="nav-item"><span class="nav-icon">🚪</span> Login</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <button class="theme-toggle" onclick="toggleTheme()">
                <span class="theme-icon">🌙</span> Toggle Theme
            </button>
        </header>

        <div class="content-area">
            <div class="login-container">
                <h1 class="login-title">
                    <span class="lock-icon">🔐</span> Secure Login
                </h1>
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn">Log In</button>
                </form>
                <p class="forgot-password">
                    Forgot your password? <a href="#">Contact admin</a>.
                </p>
            </div>
        </div>

        <footer class="footer">
            © SECUREDAnalytics | Powered by LION Institute
        </footer>
    </main>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
        }
    </script>
</body>
</html>
